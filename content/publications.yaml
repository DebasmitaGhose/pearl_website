  - title: "Adapting Robot Actions to Human Intentions in Dynamic Shared Environments"
    authors: "Debasmita Ghose"
    venue: "HRI Pioneers"
    journal: "ACM/IEEE HRI Pioneers Workshop, Melbourne, Australia, 2025"
    year: 2025
    sortOrder: 10
    abstract: "In my work, I study how robots can infer and adapt to human intentions in dynamic environments. My prior work focuses on three key methods for adapting robot actions based on inferences of human intent: passive observation, active influence, and high-level verbal commands. Moving forward, I aim to improve how robots anticipate and respond to evolving human behavior by addressing the challenges of predicting changes in human intentions and quantifying human adaptability."
