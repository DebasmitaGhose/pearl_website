  - title: "On-the-Job Robot Adaptation to Human Goals"
    authors: "Debasmita Ghose"
    venue: "RSS Pioneers"
    journal: "Robotics: Science and Systems (RSS) Pioneers Workshop, Sydney, Australia, 2026"
    year: 2026
    sortOrder: 16
    abstract: "Human-robot collaboration requires robots to maintain shared understanding with people as goals change during interaction. This work presents methods for on-the-job adaptation that let a robot infer and update its belief about a human partner's goals from natural interaction signals—observed behavior, active influence at Critical Decision Points, and high-level language—without offline retraining or constant explicit supervision."
