  - title: "Exploring Robot-Led Activities between People Living with Dementia and Family Care Partners"
    authors: "Jirachaya Fern Limprayoon, Debasmita Ghose, Kayla Matheus, Paula V. Enriquez, Michal A. Lewkowicz, Moon Hwan Kim, Austin Narcomey, Natnaree Proud Ua-Arak, Andy Cheng, Chayan Sarkar, Joan K. Monin, Brian Scassellati"
    venue: "Frontiers"
    journal: "Frontiers in Robotics and AI, 2026"
    year: 2026
    sortOrder: 15
    abstract: "This paper investigates the adaptation of a socially assistive robot, Ommie, originally designed to support people with anxiety, to address the specific needs of people living with dementia and their care partners. We explore how Ommie can be repurposed to guide shared deep breathing and singing activities. We refined the robot's behaviors through two interaction design sessions with people living with dementia and care partners, mediated by an occupational therapist. In a subsequent study with 17 pairs of people living with dementia and care partners, participants reported the interactions as easy to follow, calming, and familiar. Post-hoc video analysis revealed patterns of intimacy and synchrony, including frequent physical touch, mutual gaze, and rhythmic coordination. We also observed instances of personal memory recall and a playful atmosphere, in which pairs often used humor as a coping mechanism after deviations from the robot's instructions. From our observations, we discuss three design opportunity spaces: the robot as the focus for synchronization, as an instrument of joint play, and as a source of familiarity versus variety."
