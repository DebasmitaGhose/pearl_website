  - title: "A Replicable, Autonomous System for In-the-Wild Mental Health Applications with the Ommie Robot"
    authors: "Kayla Matheus, Debasmita Ghose, Jirachaya Fern Limprayoon, Michal Lewkowicz, Brian Scassellati"
    venue: "HRI"
    journal: "HRI 2026 Interactivity Track, Edinburgh, Scotland — Best Demo Award"
    year: 2026
    sortOrder: 13
    abstract: "We present the Ommie Deployable System (DS), a replicable, autonomous platform for long-term, in-the-wild mental health applications with the Ommie robot. Ommie DS builds on prior anxiety-focused deployments by introducing robust hardware, enhanced sensing, modular software, a companion tablet, and wireless multi-device architecture to support daily deep-breathing interactions in homes. Designed using off-the-shelf components and rapid-prototyped enclosures, the system enables reliable multi-week use, remote monitoring, and easy customization. By providing a durable, open, and researcher-friendly platform, Ommie DS supports scalable studies of wellbeing-focused social robots in the real world."
