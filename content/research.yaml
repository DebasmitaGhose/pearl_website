theme: >-
  Our long-term vision is to make robots ordinary in people's everyday
  lives—partners that notice what someone is trying to do, adapt as goals
  change, and help without constant instruction. At PEARL, that vision shapes
  how we study robots that infer people's goals, adapt from high-level natural
  language, learn from human guidance, and hold up in real homes and other
  in-the-wild settings. The areas below are the threads that organize this work.
areas:
  - title: Robots inferring people's goals
    slug: goal-inference
    description: >-
      For robots to help effectively, they need to understand what a person is
      trying to achieve—even when that goal is never stated outright. We study
      how robots can infer goals from what people do and from high-level
      instructions, and how they can actively influence the interaction so that
      people's behavior becomes more informative about their intent. We start
      from the assumption that human goals are static and lie within a fixed,
      known set, then progressively relax those assumptions toward more realistic
      collaboration: goals that change mid-task, and goal sets that are open-ended
      rather than known in advance. The aim is robots that keep a useful model of
      human goals as that uncertainty grows.
    image: /images/pages/research/ive-changed-my-mind-teaser.png
    publicationTitles:
      - "Robots Influencing Humans to Reveal their Goals during Collaboration and Competition"
      - "On-the-Job Robot Adaptation to Human Goals"
      - "I've Changed My Mind: Robots Adapting to Changing Human Goals during Collaboration"
      - "Adapting Robot Actions to Human Intentions in Dynamic Shared Environments"
      - "Planning with Critical Decision Points: Robots that Influence Humans to Infer Their Strategy"
  - title: Robots adapting to people from high-level natural language instructions
    slug: collaboration
    description: >-
      People often steer robots with high-level language—preferences for what to
      make, what to avoid, or how to help—rather than spelling out every action.
      We use this high-level language in two ways: to shape an existing
      human–robot collaboration policy at inference time, and to combine it with
      people’s actions to infer open-ended goals.
    image: /images/pages/research/transparent-matrix-overlays-teaser.png
    publicationTitles:
      - "Open-Ended Goal Inference through Actions and Language for Human-Robot Collaboration"
      - "Interactive Policy Shaping for Human-Robot Collaboration with Transparent Matrix Overlays"
  - title: Robots learning from people
    slug: assistive
    description: >-
      We build and deploy systems that support wellbeing in everyday environments,
      including mental health applications and robot-led activities for people living
      with dementia and their care partners.
    publicationTitles:
      - "Tailoring Visual Object Representations to Human Requirements: A Case Study with a Recycling Robot"
      - "Why We Should Build Robots that both Teach and Learn"
  - title: In-the-wild robot deployments with people
    slug: perception
    description: >-
      Many challenges for robots that work with people only show up outside the
      lab—over days and weeks, in people’s homes, under everyday use. We study
      in-the-wild deployments where robots support people over extended periods:
      a two-week in-home exercise coaching study with pre-scripted robot
      behaviors, robot-facilitated activities between people living with dementia
      and their care partners, and a multi-week guided breathing intervention for
      adolescents with anxiety. These deployments shape how we approach long-term
      adaptation in embodied systems.
    image: /images/pages/research/in-the-wild-deployments-collage-v3.jpg
    publicationTitles:
      - "Exploring Robot-Led Activities between People Living with Dementia and Family Care Partners"
      - "A Replicable, Autonomous System for In-the-Wild Mental Health Applications with the Ommie Robot"
      - "The Impact of an In-Home Co-Located Robotic Coach in Helping People Make Fewer Exercise Mistakes"
