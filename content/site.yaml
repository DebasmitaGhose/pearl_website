labName: PEARL
labSubtitle: PEople Aligned Robots Lab
institution: University of Illinois Chicago
tagline: Designing robots that adapt to people in shared tasks—with minimal burden on the humans they work with.
researchSummary: >-
  The PEople Aligned Robots Lab (PEARL) at the University of Illinois Chicago
  studies how robots can infer, anticipate, and adapt to human goals during
  collaboration. We build methods for open-ended goal inference, on-the-job
  adaptation, and socially assistive interaction—bridging human-robot
  interaction, robot learning, and real-world deployment.
