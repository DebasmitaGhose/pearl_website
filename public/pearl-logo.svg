<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" aria-hidden="true">
  <!-- Soft outer ring -->
  <circle cx="80" cy="80" r="74" stroke="currentColor" stroke-width="2" opacity="0.22"/>

  <!-- Human hand reaching down from above -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Palm / wrist -->
    <path
      d="M58 18c-1.5 8-1 16 1.5 24 2 6.5 5.5 12 10.5 16.5"
      stroke-width="5.5"
      opacity="0.95"
    />
    <!-- Thumb -->
    <path
      d="M68 46c6 1.5 11 5 14 10"
      stroke-width="4.5"
      opacity="0.9"
    />
    <!-- Fingers reaching toward pearl -->
    <path d="M72 58c1.5 7 2 12 1.5 16" stroke-width="4" opacity="0.95"/>
    <path d="M80 56c0.5 8 0.5 14 0 18" stroke-width="4.5" opacity="0.95"/>
    <path d="M88 57c-0.5 7-1 13-2 17" stroke-width="4" opacity="0.95"/>
    <path d="M95 55c-2 6.5-4 12-6.5 16.5" stroke-width="3.5" opacity="0.85"/>
  </g>

  <!-- Soft glow behind pearl -->
  <circle cx="80" cy="80" r="22" fill="currentColor" opacity="0.08"/>

  <!-- Pearl -->
  <circle cx="80" cy="80" r="16" fill="currentColor" opacity="0.92"/>
  <circle cx="80" cy="80" r="16" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
  <!-- Pearl highlight -->
  <circle cx="74" cy="74" r="4.5" fill="#fff" opacity="0.55"/>
  <circle cx="76.5" cy="76.5" r="1.6" fill="#fff" opacity="0.8"/>

  <!-- Robot hand reaching up from below -->
  <g stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" fill="none">
    <!-- Mechanical wrist / forearm -->
    <path
      d="M102 142c1-8 0-16-3-23.5-2.5-6-6.5-11-12-15"
      stroke-width="5.5"
      opacity="0.95"
    />
    <!-- Joint block -->
    <rect
      x="79"
      y="108"
      width="14"
      height="10"
      rx="1.5"
      stroke-width="2.5"
      opacity="0.9"
      transform="rotate(-28 86 113)"
    />
    <!-- Articulated fingers toward pearl -->
    <path d="M78 108c-1-6-0.5-11 1-15" stroke-width="3.5" opacity="0.95"/>
    <path d="M86 106c0-7 0-12 0.5-16" stroke-width="4" opacity="0.95"/>
    <path d="M93 108c1.5-6 2-11 2-15" stroke-width="3.5" opacity="0.9"/>
    <!-- Thumb gripper -->
    <path d="M74 112c-5-2-9-6-11-11" stroke-width="3.5" opacity="0.85"/>
    <!-- Small sensor / rivet details -->
    <circle cx="98" cy="128" r="2" fill="currentColor" opacity="0.7"/>
    <circle cx="94" cy="135" r="1.5" fill="currentColor" opacity="0.55"/>
  </g>
</svg>
