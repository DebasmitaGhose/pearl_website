<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" aria-hidden="true">
  <circle cx="80" cy="80" r="74" stroke="currentColor" stroke-width="2" opacity="0.18"/>

  <!-- Human hand (top): softer organic shapes -->
  <g fill="currentColor">
    <!-- Palm -->
    <path
      d="M52 12c2 14 4 26 10 36 3 5 8 9 14 12l6-10c-4-2-7-5-9-9-4-8-5-18-6-29z"
      opacity="0.9"
    />
    <!-- Thumb -->
    <path
      d="M76 52c8 2 14 8 17 15l-9 5c-2-4-6-8-11-9z"
      opacity="0.85"
    />
    <!-- Fingers -->
    <rect x="68" y="54" width="7" height="22" rx="3.5" opacity="0.92" transform="rotate(-6 71.5 65)"/>
    <rect x="77" y="52" width="8" height="26" rx="4" opacity="0.95"/>
    <rect x="87" y="54" width="7" height="22" rx="3.5" opacity="0.9" transform="rotate(7 90.5 65)"/>
    <rect x="96" y="56" width="6" height="18" rx="3" opacity="0.8" transform="rotate(14 99 65)"/>
  </g>

  <!-- Pearl glow -->
  <circle cx="80" cy="84" r="24" fill="currentColor" opacity="0.07"/>

  <!-- Pearl -->
  <circle cx="80" cy="84" r="17" fill="currentColor" opacity="0.95"/>
  <circle cx="80" cy="84" r="17" stroke="currentColor" stroke-width="1.25" opacity="0.25"/>
  <circle cx="73.5" cy="77.5" r="5" fill="#fff" opacity="0.5"/>
  <circle cx="76" cy="80" r="1.8" fill="#fff" opacity="0.85"/>

  <!-- Robot hand (bottom): angular mechanical forms -->
  <g fill="currentColor">
    <!-- Forearm -->
    <path
      d="M118 148c-4-12-10-22-18-30l-8 8c6 6 11 14 14 24z"
      opacity="0.88"
    />
    <!-- Wrist block -->
    <path
      d="M86 112l18 8-6 12-18-9z"
      opacity="0.92"
    />
    <!-- Mechanical fingers -->
    <rect x="70" y="90" width="6" height="20" rx="1.5" opacity="0.9" transform="rotate(8 73 100)"/>
    <rect x="79" y="86" width="7" height="24" rx="1.5" opacity="0.95"/>
    <rect x="89" y="90" width="6" height="20" rx="1.5" opacity="0.88" transform="rotate(-10 92 100)"/>
    <!-- Gripper thumb -->
    <path d="M66 108l-10-12 6-5 10 11z" opacity="0.82"/>
    <!-- Rivets -->
    <circle cx="104" cy="128" r="2.2" opacity="0.75"/>
    <circle cx="98" cy="138" r="1.7" opacity="0.6"/>
  </g>
</svg>
